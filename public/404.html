<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Lily Feng</title>
    <script>
      // Stash the requested path, bounce to the app, let it restore the route.
      (function () {
        try {
          sessionStorage.setItem(
            "spa-redirect",
            window.location.pathname + window.location.search + window.location.hash
          );
        } catch (error) {
          /* private browsing — fall through to the home page */
        }
        window.location.replace("/");
      })();
    </script>
  </head>
  <body></body>
</html>
